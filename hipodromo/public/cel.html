<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1f15">
<title>Jackpot Jockeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700;1,900&display=swap">
<style>
  /* Misma estética del hipódromo de la pantalla grande: verde paño, dorado y crema; minimalista y con botones grandes */
  :root {
    --bg: #0b1f15; --card: #10291c; --card2: #173826; --sep: rgba(201,162,74,0.22); --line: rgba(201,162,74,0.35);
    --txt: #f1e8d3; --mute: #b9b09b; --accent: #e7c873; --gold: #c9a24a; --accentTxt: #0b1f15;
    --green: #7fd492; --red: #ff6b5e; --blue: #8fc7ff; --blur: rgba(11,31,21,0.92); --r: 10px;
    --display: 'Oswald', 'Arial Narrow', system-ui, sans-serif; --brand: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0 auto; max-width: 560px; color: var(--txt); font-family: var(--display); font-size: 17px; line-height: 1.3;
    padding: 0 14px calc(var(--dock, 0px) + 86px); letter-spacing: .2px;
    background: radial-gradient(120% 60% at 50% 0%, #173826 0%, var(--bg) 60%) fixed, var(--bg); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; letter-spacing: inherit; }
  button:disabled { opacity: .35; }
  .hidden { display: none !important; }
  .mute { color: var(--mute); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .brand { font-family: var(--brand); font-style: italic; font-weight: 900; }

  /* ─── Entrada ─── */
  #login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px 4px; text-align: center; }
  #login .logo { font-size: 56px; }
  #login .k { font-size: 12px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; }
  #login h1 { font-family: var(--brand); font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; margin: 0; color: var(--accent); }
  #login h1 span { color: var(--txt); }
  #login p { color: var(--mute); margin: 0 0 14px; font-size: 16px; }
  input { width: 100%; font: inherit; font-size: 19px; padding: 15px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--txt); outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--mute); }
  .big { width: 100%; padding: 16px; border-radius: var(--r); background: var(--accent); color: var(--accentTxt); font-weight: 600; font-size: 18px;
    text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 3px 0 #9c7b2e; }
  .big:active { transform: translateY(2px); box-shadow: 0 1px 0 #9c7b2e; }
  .big.green { background: #2f8a4c; color: #fff; box-shadow: 0 3px 0 #1d5a31; }
  .big.gray { background: var(--card2); color: var(--txt); box-shadow: 0 3px 0 #08160f; border: 1px solid var(--line); }

  /* ─── Barra superior ─── */
  #top { position: sticky; top: 0; z-index: 5; margin: 0 -14px 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: var(--blur); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
  #coins { font-family: var(--brand); font-style: italic; font-weight: 900; font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.05; }
  #who { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 2px; }
  #debtTag { display: inline-block; margin-left: 8px; font-family: var(--display); font-style: normal; font-size: 13px; font-weight: 500; color: var(--red); letter-spacing: 1px; text-transform: uppercase; }
  .roundBtn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 18px; font-weight: 600; color: var(--accent); }
  #status { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 11px 14px; margin-bottom: 12px; }
  #status b { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
  #status .pill { font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 20px; background: var(--card2); color: var(--accent); white-space: nowrap;
    font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: 1px; }
  #status.gp { background: linear-gradient(90deg, rgba(231,200,115,.22), var(--card)); }
  .note { font-size: 14px; color: var(--mute); margin: -4px 2px 10px; line-height: 1.35; }
  .note b { color: var(--accent); font-weight: 500; }

  /* ─── Secciones y listas ─── */
  .sec { font-size: 12px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold); margin: 16px 2px 8px; font-weight: 500; }
  .sec b { color: var(--txt); text-transform: none; font-size: 16px; letter-spacing: .3px; font-weight: 500; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .item { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 9px 12px; min-height: 60px; width: 100%; text-align: left; position: relative; }
  .item + .item::before { content: ''; position: absolute; left: 12px; right: 12px; top: 0; border-top: 1px solid var(--sep); }
  .item:active { background: var(--card2); }
  .item.sel { background: rgba(231,200,115,0.14); box-shadow: inset 3px 0 0 var(--accent); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 19px; color: #fff; position: relative;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .avatar .sk { position: absolute; right: -6px; bottom: -5px; font-size: 20px; }
  .item .t { font-weight: 500; font-size: 18px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .r { text-align: right; }
  .item .win { font-weight: 600; font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .item .x { font-size: 12px; color: var(--mute); letter-spacing: .5px; }
  .badge { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; background: var(--accent); color: var(--accentTxt); font-weight: 600; font-size: 15px; }
  .mine { font-size: 12px; color: var(--green); }
  .yours { display: inline-block; vertical-align: 2px; margin-right: 6px; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: var(--accentTxt);
    font-size: 11px; letter-spacing: 1px; }
  .item.own { box-shadow: inset 3px 0 0 var(--accent); }

  /* Tipos de apuesta */
  #types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .type { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 4px 7px; min-width: 0; }
  .type .e { font-size: 22px; line-height: 1.15; }
  .type b { display: block; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; white-space: nowrap; }
  .type small { display: block; font-size: 12px; color: var(--accent); margin-top: 1px; }
  .type.sel { border-color: var(--accent); background: rgba(231,200,115,0.16); box-shadow: 0 0 0 1px var(--accent); }

  /* ─── Panel inferior fijo (boleto / poderes) ─── */
  #dock { position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); z-index: 6; padding: 10px 14px 12px;
    background: var(--blur); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  #dock .inner { max-width: 532px; margin: 0 auto; }
  #slipTxt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; margin-bottom: 8px; min-height: 20px; }
  #slipTxt b { font-size: 16px; font-weight: 500; }
  #amounts { display: flex; gap: 6px; margin-bottom: 9px; }
  #amounts button { flex: 1; padding: 8px 0; border-radius: 8px; background: var(--card2); border: 1px solid var(--sep); font-weight: 500; font-size: 15px; }
  #amounts button.sel { background: var(--txt); color: var(--bg); border-color: var(--txt); }
  .rowBtns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .rowBtns .big { padding: 14px 6px; font-size: 16px; letter-spacing: 1px; }
  #powers { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 3px; }
  #powers::-webkit-scrollbar { display: none; }
  .pw { flex: none; width: 80px; padding: 8px 4px; border-radius: var(--r); background: var(--card2); border: 1px solid var(--line); text-align: center; }
  .pw .e { font-size: 28px; line-height: 1.1; }
  .pw b { display: block; font-size: 13px; font-weight: 500; text-transform: uppercase; margin-top: 2px; }
  .pw small { display: block; font-size: 12px; color: var(--accent); }
  .pw.bad small { color: var(--red); }
  .pw:active { transform: scale(.95); }

  /* ─── Tarjetas ─── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 2px 0 4px; font-family: var(--brand); font-style: italic; font-weight: 900; font-size: 28px; color: var(--accent); line-height: 1.1; }
  .card .k { font-size: 12px; text-transform: uppercase; color: var(--gold); letter-spacing: 2.5px; }
  .hero { font-family: var(--brand); font-style: italic; font-weight: 900; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--sep); font-size: 15px; }
  .line:first-of-type { border-top: 0; }
  .btnRow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btnRow.three { grid-template-columns: 1fr 1fr 1fr; }
  .soft { padding: 12px 6px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line); font-weight: 500; font-size: 15px; text-transform: uppercase; letter-spacing: .5px; }
  .soft.red { color: var(--red); } .soft.green { color: var(--green); } .soft.blue { color: var(--blue); }
  .shop { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 8px; }
  .skin { background: var(--card); border-radius: var(--r); padding: 10px 4px; text-align: center; border: 1px solid var(--line); }
  .skin .e { font-size: 32px; }
  .skin b { display: block; font-size: 13px; font-weight: 500; text-transform: uppercase; margin-top: 2px; }
  .skin small { display: block; font-size: 12px; color: var(--accent); }
  .skin.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pod { padding: 10px 12px; margin: 0; min-width: 0; }
  .pod .line { font-size: 14px; padding: 5px 0; }
  .pod .line span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .how { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--sep); font-size: 15px; line-height: 1.35; }
  .how:first-of-type { border-top: 0; }
  .how .e { font-size: 22px; }
  .how b { color: var(--accent); font-weight: 500; }

  /* ─── Pestañas ─── */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 0 calc(env(safe-area-inset-bottom) + 4px); background: #08170f; border-top: 1px solid var(--line); }
  nav button { display: grid; justify-items: center; gap: 1px; font-size: 11px; color: var(--mute); padding: 2px 0; position: relative; text-transform: uppercase; letter-spacing: 1px; }
  nav button .e { font-size: 21px; filter: grayscale(1); opacity: .6; }
  nav button.on { color: var(--accent); }
  nav button.on .e { filter: none; opacity: 1; }
  nav .dot { position: absolute; top: 0; right: 30%; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }

  /* Reacciones */
  #reactBox { position: fixed; right: 14px; top: calc(env(safe-area-inset-top) + 62px); z-index: 8; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px; display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #reactBox button { height: 52px; border-radius: 10px; font-size: 28px; }
  #reactBox button:active { background: var(--card2); transform: scale(.92); }

  /* Avisos y tutorial */
  #msg { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); z-index: 20; max-width: 92%;
    background: var(--card2); color: var(--txt); border: 1px solid var(--accent); padding: 11px 18px; border-radius: 10px; font-size: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); display: none; text-align: center; }
  #podSheet { position: fixed; inset: 0; z-index: 15; background: rgba(5,14,9,.8); display: flex; align-items: flex-end; }
  #podSheet .sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg); border-top: 2px solid var(--accent); border-radius: 16px 16px 0 0;
    padding: 18px 14px calc(env(safe-area-inset-bottom) + 16px); max-height: 92vh; overflow-y: auto; }
  #podSheet .k { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
  #podSheet h2 { font-family: var(--brand); font-style: italic; font-weight: 900; font-size: 28px; color: var(--accent); margin: 2px 0 12px; }
  #tuto { position: fixed; inset: 0; z-index: 15; background: rgba(5,14,9,.8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: flex-end; }
  #tuto .sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border-top: 2px solid var(--accent); border-radius: 16px 16px 0 0;
    padding: 20px 20px calc(env(safe-area-inset-bottom) + 18px); max-height: 92vh; overflow-y: auto; }
  #tuto .k { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
  #tuto .e { font-size: 50px; margin-top: 6px; }
  #tuto h2 { font-family: var(--brand); font-style: italic; font-weight: 900; font-size: 30px; color: var(--accent); margin: 4px 0 8px; line-height: 1.1; }
  #tuto p { font-size: 17px; line-height: 1.45; color: var(--mute); margin: 0 0 12px; font-family: var(--display); }
  #tuto p b { color: var(--txt); font-weight: 500; }
  #tuto .ex { background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; color: var(--txt); margin-bottom: 14px; line-height: 1.4; }
  #tuto .ex b { color: var(--accent); font-weight: 500; }
  #tuto .dots { display: flex; gap: 5px; margin: 0 0 4px; }
  #tuto .dots i { flex: 1; height: 3px; background: var(--card2); }
  #tuto .dots i.on { background: var(--accent); }
  #tuto .rowBtns { grid-template-columns: 1fr 2fr; }
</style>
</head>
<body>

<div id="login">
  <div class="logo">🏇</div>
  <div class="k">Carreras de caballos con cerebro</div>
  <h1>Jackpot <span>Jockeys</span></h1>
  <p>Apuesta a caballos que piensan solos.</p>
  <input id="salaIn" placeholder="Código de la sala" maxlength="4" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;text-align:center;letter-spacing:6px">
  <input id="nameIn" placeholder="Tu nombre" maxlength="16" autocomplete="off">
  <button class="big" id="joinBtn">Entrar a jugar</button>
</div>

<div id="game" class="hidden">
  <div id="top">
    <div><div id="who"></div><div id="coins">🪙 0</div></div>
    <div style="display:flex;gap:8px"><button class="roundBtn" id="podBtn" aria-label="Podios">🏆</button><button class="roundBtn" id="fab" aria-label="Reacciones">😂</button><button class="roundBtn" id="helpBtn" aria-label="Cómo se juega">?</button></div>
  </div>
  <div id="status"><b id="statusTxt"></b><span class="pill" id="statusPill"></span></div>

  <section id="tab-carrera">
    <div id="results" class="hidden"></div>
    <div id="live" class="hidden"></div>
    <div id="betArea">
      <div class="note" id="oddsNote"></div>
      <div class="sec">① ¿Qué apuestas?</div>
      <div id="types"></div>
    </div>
    <div class="sec" id="horsesTitle"></div>
    <div class="group" id="horses"></div>
    <div id="tickets"></div>
  </section>
  <section id="tab-caballo" class="hidden"></section>
  <section id="tab-mafia" class="hidden"></section>
  <section id="tab-pena" class="hidden"></section>
</div>

<div id="dock" class="hidden"><div class="inner">
  <div id="betDock">
    <div id="slipTxt"></div>
    <div id="amounts"></div>
    <div class="rowBtns"><button class="big" id="betBtn">Apostar</button><button class="big gray" id="readyBtn">Listo</button></div>
  </div>
  <div id="powerDock" class="hidden">
    <div id="powerTxt" style="font-size:15px;margin-bottom:8px"></div>
    <div id="powers"></div>
  </div>
</div></div>

<div id="reactBox" class="hidden"></div>

<nav id="nav" class="hidden">
  <button data-tab="carrera" class="on"><span class="e">🏇</span>Carrera</button>
  <button data-tab="caballo"><span class="e">🐴</span>Mi caballo</button>
  <button data-tab="mafia"><span class="e">💼</span>Mafia</button>
  <button data-tab="pena"><span class="e">🤝</span>Peña</button>
</nav>

<div id="tuto" class="hidden"><div class="sheet">
  <div class="dots" id="tutoDots"></div>
  <div class="k" id="tutoK"></div>
  <div class="e" id="tutoE"></div>
  <h2 id="tutoTitle"></h2>
  <p id="tutoText"></p>
  <div class="ex" id="tutoEx"></div>
  <div class="rowBtns"><button class="big gray" id="tutoSkip">Saltar</button><button class="big" id="tutoNext">Siguiente</button></div>
</div></div>

<div id="podSheet" class="hidden"><div class="sheet">
  <div class="k">Podios en vivo</div>
  <h2>¿Quién va ganando?</h2>
  <div id="podBody"></div>
  <button class="big" id="podClose" style="margin-top:14px">Cerrar</button>
</div></div>

<div id="msg"></div>

<script>
const PAGE_BUILD = '__BUILD__'; // lo pone el servidor al servir la página
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);
let sala = (params.get('sala') || store.get('jj_sala') || '').toUpperCase();
let myId = store.get('jj_id');
let state = null, me = null, selHorse = null, amount = 100, lastRaceKey = null, joining = false, showTickets = false;
let betType = 'ganador', picks = []; // apuesta en preparación: tipo y caballos en orden (1º, 2º, 3º)
const ORD = ['1º', '2º', '3º'];

// Tipos de apuesta en palabras sencillas
const TYPE_UI = {
  ganador: { e: '🥇', name: 'Que gane', how: 'Elige el caballo que crees que llega primero' },
  place: { e: '🥈', name: 'Top 2', how: 'Elige un caballo que llegue 1º o 2º' },
  podio: { e: '🥉', name: 'Podio', how: 'Elige un caballo que llegue entre los 3 primeros' },
  quiniela: { e: '👯', name: 'Pareja', how: 'Elige los 2 que llegan primero, en cualquier orden' },
  exacta: { e: '🎯', name: '1º y 2º', how: 'Elige quién llega 1º y luego quién llega 2º' },
  trifecta: { e: '🏆', name: '1º, 2º y 3º', how: 'Elige el 1º, el 2º y el 3º, en orden. ¡Paga muchísimo!' },
};

// Las mismas cuotas que calcula la casa (cuotas.js): Harville con la forma de cada caballo y el factor de pago de la carrera
function orderedProb(p, sel) { let prob = 1, used = 0; for (const i of sel) { prob *= p[i] / (1 - used); used += p[i]; } return prob; }
function betProb(type, sel, p) {
  const n = p.length, others = i => [...Array(n).keys()].filter(x => x !== i), i = sel[0];
  if (type === 'ganador') return p[i];
  if (type === 'place') return p[i] + others(i).reduce((a, j) => a + orderedProb(p, [j, i]), 0);
  if (type === 'podio') { let r = p[i]; for (const j of others(i)) { r += orderedProb(p, [j, i]); for (const k of others(i)) if (k !== j) r += orderedProb(p, [j, k, i]); } return r; }
  if (type === 'quiniela') return orderedProb(p, [sel[0], sel[1]]) + orderedProb(p, [sel[1], sel[0]]);
  return orderedProb(p, sel);
}
function quote(type, sel) {
  const prob = betProb(type, sel, state.probs);
  return +Math.min(5000, Math.max(1.05, state.pay[type] / prob)).toFixed(2);
}
// Pago máximo de un tipo (para decirle al jugador "hasta cuánto paga")
function maxOdds(type, picks) {
  const n = state.horses.length;
  let best = 0;
  const rec = sel => { if (sel.length === picks) { best = Math.max(best, quote(type, sel)); return; } for (let i = 0; i < n; i++) if (!sel.includes(i)) rec([...sel, i]); };
  rec([]);
  return best;
}
const TIPS = [
  'Lo que dice tu boleto es lo que ganas, aunque los demás apuesten después.',
  'En la carrera 1 todos son iguales. Después, el que gana paga menos y el que pierde paga más.',
  'Las cuotas suben las primeras carreras y cada 8 carreras hay un Gran Premio que paga 50 % más.',
  'Top 2 y Podio ganan seguido pero pagan poco. 1º, 2º y 3º casi nunca… pero paga una fortuna.',
  'Los poderes cuestan fichas: úsalos cuando tu caballo lo valga.',
]
let tip = TIPS[Math.floor(Math.random() * TIPS.length)];
const xs = n => 'x' + (n >= 100 ? Math.round(n).toLocaleString('es') : String(+n.toFixed(n >= 10 ? 1 : 2)));
const pickNames = (type, sel) => sel.map(i => state.horses[i].name).join(type === 'quiniela' ? ' y ' : ' → ');
const AMOUNTS = [10, 50, 100, 250, 'Todo'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n).toLocaleString('es');
const signed = n => `<span class="${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? '+' : ''}${fmt(n)}</span>`;
const setHTML = (id, html) => { const el = document.getElementById(id); if (el._h !== html) { el.innerHTML = html; el._h = html; } };
const skinIcon = h => h.skin && h.skin !== 'normal' && state.cfg.skins[h.skin] ? state.cfg.skins[h.skin].icon : '';
const betAmount = () => amount === 'Todo' ? me.coins : Math.min(amount, me.coins);

document.getElementById('salaIn').value = sala;
if (params.get('sala')) document.getElementById('salaIn').style.display = 'none';

function toast(text) {
  const m = document.getElementById('msg');
  m.textContent = text; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 2400);
}
const tap = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };

async function api(action, body = {}) {
  // Por la conexión abierta es inmediato; si no hay conexión, por HTTP. No se reintenta por HTTP
  // una acción ya enviada, para no duplicar apuestas si la respuesta se demora.
  let j;
  if (es && es.ready() && action !== 'join') {
    j = await es.request({ action, ...body });
    if (!j) { toast('La conexión está lenta: revisa en un momento si se aplicó.'); return null; }
  } else j = await fetch('/api/' + action, { method: 'POST', body: JSON.stringify({ sala, id: myId, ...body }) }).then(r => r.json());
  if (j.error) { toast(j.error); return null; }
  return j;
}

document.getElementById('joinBtn').onclick = async () => {
  sala = document.getElementById('salaIn').value.trim().toUpperCase();
  if (sala.length !== 4) return toast('El código tiene 4 letras: míralo en la pantalla grande');
  const j = await api('join', { name: document.getElementById('nameIn').value });
  if (j) { myId = j.id; store.set('jj_id', myId); store.set('jj_sala', sala); connect(); }
};

// ─── Acciones de la pestaña Carrera ───
document.getElementById('betBtn').onclick = async () => {
  const n = state.pools[betType].picks;
  if (picks.length !== n) return toast(n === 1 ? 'Primero elige un caballo' : `Elige ${n} caballos`);
  const a = betAmount();
  if (a <= 0) return toast('No tienes fichas. La mafia presta…');
  tap();
  if (await api('bet', { type: betType, sel: picks, amount: a })) { toast(`¡Apostado! ${TYPE_UI[betType].e} ${pickNames(betType, picks)}`); picks = []; render(); }
};
document.getElementById('readyBtn').onclick = () => { tap(); api('ready', { ready: !me.ready }); };
document.getElementById('types').onclick = e => {
  const b = e.target.closest('.type'); if (!b) return;
  betType = b.dataset.t;
  picks = picks.slice(0, state.pools[betType].picks);
  render();
};
document.getElementById('amounts').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  amount = b.dataset.a === 'Todo' ? 'Todo' : +b.dataset.a; render();
};
document.getElementById('powers').onclick = e => {
  const b = e.target.closest('.pw'); if (!b || b.disabled) return;
  if (selHorse == null) return toast('Primero toca un caballo de la lista');
  tap();
  const k = b.dataset.k;
  if (k === 'mafia') return api('mafiaFavor', { horse: selHorse }).then(j => j && toast(`🕴️ La mafia congela a ${state.horses[selHorse].name}. Le debes ${state.cfg.mafiaFavorCost} más.`));
  api('power', { power: k, horse: selHorse }).then(j => j && toast(`${state.powers[k].icon} ${state.powers[k].name} para ${state.horses[selHorse].name}`));
};
document.getElementById('horses').onclick = e => {
  const el = e.target.closest('.item'); if (!el) return;
  const i = +el.dataset.i;
  tap();
  if (state.phase === 'apuestas') {
    // Elegir caballos en orden: tocar de nuevo uno elegido lo quita
    const n = state.pools[betType].picks;
    if (n === 1) picks = picks[0] === i ? [] : [i];
    else if (picks.includes(i)) picks = picks.filter(x => x !== i);
    else if (picks.length < n) picks.push(i);
    else picks[n - 1] = i;
  } else selHorse = selHorse === i ? null : i;
  render();
};

// ─── Render ───
function render() {
  if (!state || !me) return;
  const s = state;
  document.getElementById('who').textContent = `${me.name} · sala ${s.sala}`;
  document.getElementById('coins').innerHTML = `🪙 ${fmt(me.coins)}${me.debt ? `<span id="debtTag">debes ${fmt(me.debt)}</span>` : ''}`;
  const status = document.getElementById('status');
  status.classList.toggle('gp', !!s.grandPrix);
  const toGP = s.match.grandPrixEvery - (s.match.race % s.match.grandPrixEvery);
  const raceName = s.grandPrix ? '🏆 Gran Premio' : `Carrera ${s.match.race}`;
  const st = {
    apuestas: [raceName, s.timeLeft != null ? `Arranca en ${s.timeLeft}` : !s.oddsReady ? 'Preparando…' : `${s.readyCount}/${s.onlineCount} listos`],
    carrera: ['🏁 ¡Están corriendo!', `${s.laps} vueltas`],
    resultados: ['🏆 Resultados', toGP === 1 ? `Gran Premio en ${s.timeLeft}s` : `${s.timeLeft}s`],
  }[s.phase];
  document.getElementById('statusTxt').textContent = st[0];
  document.getElementById('statusPill').textContent = st[1];

  const dots = { pena: me.invites.length > 0, mafia: me.debt > 0, caballo: !!(me.horse && me.horse.training) };
  document.querySelectorAll('nav button').forEach(b => {
    const d = dots[b.dataset.tab];
    if (d && !b.querySelector('.dot')) b.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
    if (!d) b.querySelector('.dot')?.remove();
  });
  for (const f of [renderCarrera, renderCaballo, renderMafia, renderPena]) {
    try { f(); } catch (e) { console.error(e); } // si una parte falla, el resto de la pantalla sigue al día
  }
  if (!document.getElementById('podSheet').classList.contains('hidden')) setHTML('podBody', podiumsHTML());
  // El panel inferior solo en la pestaña Carrera
  const onCarrera = !document.getElementById('tab-carrera').classList.contains('hidden');
  const dockOn = onCarrera && (s.phase === 'apuestas' || s.phase === 'carrera');
  document.getElementById('dock').classList.toggle('hidden', !dockOn);
  const h = dockOn ? document.getElementById('dock').offsetHeight : 0;
  document.body.style.setProperty('--dock', h + 'px');
}

function renderCarrera() {
  const s = state, betting = s.phase === 'apuestas', racing = s.phase === 'carrera';
  const T = s.pools[betType], U = TYPE_UI[betType];
  document.getElementById('betArea').classList.toggle('hidden', !betting);
  document.getElementById('betDock').classList.toggle('hidden', !betting);
  document.getElementById('powerDock').classList.toggle('hidden', !racing);

  const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r + 'º';
  setHTML('oddsNote', !betting ? '' : s.grandPrix ? '🏆 <b>Gran Premio:</b> todas las cuotas pagan 50 % más.'
    : s.match.race === 1 ? '🎲 <b>Carrera 1: todos iguales, manda el azar.</b> Que gane paga x2 en cualquier caballo.'
    : '📈 Las cuotas cambian con los resultados: <b>el que gana paga menos, el que pierde paga más.</b>');
  // ① Tipos de apuesta con "hasta cuánto paga"
  setHTML('types', Object.entries(TYPE_UI).map(([k, u]) =>
    `<button class="type ${betType === k ? 'sel' : ''}" data-t="${k}"><div class="e">${u.e}</div><b>${u.name}</b><small>${s.oddsReady ? `hasta ${xs(maxOdds(k, s.pools[k].picks))}` : '…'}</small></button>`).join(''));

  // ② Caballos
  document.getElementById('horsesTitle').innerHTML = betting ? `② <b>${esc(U.how)}</b>` : racing ? 'Toca un caballo para ayudarlo o molestarlo' : 'Llegada';
  const rows = s.horses.map((h, i) => ({ h, i }));
  if (!betting) rows.sort((a, b) => a.h.pos - b.h.pos);
  const a = betAmount();
  setHTML('horses', rows.map(({ h, i }) => {
    const pk = picks.indexOf(i), chosen = betting ? pk >= 0 : selHorse === i;
    const mine = me.tickets.filter(tk => tk.sel.includes(i)).reduce((x, tk) => x + tk.amount, 0);
    let right = '';
    if (betting && s.oddsReady) {
      if (T.picks === 1) { const q = quote(betType, [i]); right = `<div class="win">gana ${fmt(Math.floor(q * a))}</div><div class="x">${xs(q)}</div>`; }
      else right = pk >= 0 ? `<span class="badge">${betType === 'quiniela' ? '✓' : ORD[pk]}</span>` : `<div class="x">${xs(h.odds)} solo</div>`;
    } else if (!betting) right = `<span class="badge" style="background:var(--card2);color:var(--txt)">${h.pos}º</span>`;
    const sub = betting
      ? (h.recent && h.recent.length ? `últimas: ${h.recent.map(medal).join(' ')}` : h.ownerName ? `de ${esc(h.ownerName)}` : esc(h.estilo[0].toUpperCase() + h.estilo.slice(1)))
      : `vuelta ${h.lap}/${s.laps}${h.hits ? ` · ${h.hits} choques` : ''}`;
    return `<button class="item ${chosen ? 'sel' : ''} ${me.horse && me.horse.inRace === i ? 'own' : ''}" data-i="${i}">
      <div class="avatar" style="background:${h.color}">${i + 1}${skinIcon(h) ? `<span class="sk">${skinIcon(h)}</span>` : ''}</div>
      <div><div class="t">${me.horse && me.horse.inRace === i ? '<span class="yours">Tuyo</span>' : ''}${esc(h.name)}</div><div class="s">${sub}${mine ? ` · <span class="mine">🎟 ${fmt(mine)}</span>` : ''}</div></div>
      <div class="r">${right}</div></button>`;
  }).join(''));

  // ③ Boleto en el panel inferior
  if (betting) {
    let txt;
    if (!s.oddsReady) txt = `<span class="mute">⏳ La casa está calculando las cuotas… ${esc(tip)}</span>`;
    else if (picks.length === T.picks) {
      const q = quote(betType, picks);
      txt = `<span>${U.e} <b>${esc(pickNames(betType, picks))}</b></span><span class="mute">${xs(q)}</span>`;
    } else txt = `<span class="mute">${U.e} ${T.picks === 1 ? 'Toca un caballo de la lista' : `Elegidos ${picks.length} de ${T.picks}`}</span>`;
    setHTML('slipTxt', txt);
    setHTML('amounts', AMOUNTS.map(v => `<button data-a="${v}" class="${amount === v ? 'sel' : ''}">${v}</button>`).join(''));
    const bb = document.getElementById('betBtn');
    const ready = s.oddsReady && picks.length === T.picks && a > 0;
    bb.disabled = !ready;
    bb.textContent = ready ? `Apostar ${fmt(a)} · ganas ${fmt(Math.floor(quote(betType, picks) * a))}` : `Apostar ${fmt(a)}`;
    const rb = document.getElementById('readyBtn');
    rb.textContent = me.ready ? '✓ Listo' : 'Listo';
    rb.className = 'big ' + (me.ready ? 'green' : 'gray');
  }

  // En carrera: poderes
  if (racing) {
    const target = selHorse != null ? s.horses[selHorse] : null;
    setHTML('powerTxt', target ? `Poder para <b>${esc(target.name)}</b>` : '<span class="mute">Toca un caballo de la lista y luego un poder</span>');
    const cd = me.cooldown || 0;
    setHTML('powers', Object.entries(s.powers).map(([k, p]) =>
      `<button class="pw ${p.debuff ? 'bad' : ''}" data-k="${k}" ${me.coins < p.cost || cd > 0 ? 'disabled' : ''}><div class="e">${p.icon}</div><b>${esc(p.name)}</b><small>🪙 ${p.cost}</small></button>`).join('')
      + `<button class="pw bad" data-k="mafia" ${me.favorUsed || me.debt + s.cfg.mafiaFavorCost > s.cfg.maxDebt ? 'disabled' : ''}><div class="e">🕴️</div><b>Sabotaje</b><small>fiado ${s.cfg.mafiaFavorCost}</small></button>`);
  }

  // En vivo: cuánto ganarías si terminara ahora
  const live = document.getElementById('live');
  if (racing && me.tickets.length && me.live) {
    live.classList.remove('hidden');
    const spent = me.race.bets + me.race.powers, got = me.live.gross - me.live.mafia;
    setHTML('live', `<div class="card"><div class="k">Si terminara ahora</div>
      <div class="hero ${me.live.gross ? 'pos' : 'mute'}">${me.live.gross ? `Ganas ${fmt(me.live.gross)}` : 'Todavía no ganas'}</div>
      <div class="mute" style="font-size:14px">Pusiste ${fmt(spent)} · resultado ${signed(got - spent)}${me.live.mafia ? ` · la mafia se lleva ${fmt(me.live.mafia)}` : ''}</div></div>`);
  } else live.classList.add('hidden');

  // Mis boletos
  if ((betting || racing) && me.tickets.length) {
    const best = me.tickets.reduce((x, tk) => x + tk.ifHit, 0);
    setHTML('tickets', `<div class="sec">Mis boletos · si aciertan ganas hasta <b>${fmt(best)}</b></div><div class="group">${me.tickets.map(tk =>
      `<div class="item" style="grid-template-columns:44px 1fr auto"><div class="avatar" style="background:var(--card2);font-size:22px">${TYPE_UI[tk.type].e}</div>
        <div><div class="t" style="font-size:15px">${esc(pickNames(tk.type, tk.sel))}</div><div class="s">${TYPE_UI[tk.type].name} · ${xs(tk.odds)} · pusiste ${fmt(tk.amount)}</div></div>
        <div class="r"><div class="win">${fmt(tk.ifHit)}</div></div></div>`).join('')}</div>`);
  } else setHTML('tickets', '');

  // Resultados
  const res = document.getElementById('results');
  if (s.phase === 'resultados' && s.results) {
    const r = s.results, wins = r.payouts.filter(p => p.id === me.id);
    const won = wins.reduce((x, p) => x + p.win, 0), l = me.lastRace;
    res.classList.remove('hidden');
    setHTML('results', `<div class="card" style="text-align:center">
        <div class="k">${r.grandPrix ? 'Ganó el Gran Premio' : 'Ganó'}</div>
        <h2>${skinIcon(s.horses[r.winner])} ${esc(s.horses[r.winner].name)}</h2>
        <div class="mute" style="font-size:14px">${esc(r.quip || '')}</div>
        ${l ? `<div class="hero ${l.net > 0 ? 'pos' : l.net < 0 ? 'neg' : 'mute'}" style="margin-top:10px">${l.net > 0 ? '🎉 ' : l.net < 0 ? '😢 ' : ''}${signed(l.net)}</div>
          <div class="mute" style="font-size:14px">${won ? 'Tu resultado en esta carrera' : 'Esta vez no acertaste'}</div>
          <div style="text-align:left;margin-top:10px">
            <div class="line"><span>🎟️ Apostaste</span><span class="neg">−${fmt(l.bets)}</span></div>
            ${l.powers ? `<div class="line"><span>🥕 Poderes</span><span class="neg">−${fmt(l.powers)}</span></div>` : ''}
            <div class="line"><span>💰 Cobraste</span><span class="${l.won ? 'pos' : 'mute'}">+${fmt(l.won)}</span></div>
            ${l.mafia ? `<div class="line"><span>🕴️ Se llevó la mafia</span><span class="neg">−${fmt(l.mafia)}</span></div>` : ''}
            ${l.commission ? `<div class="line"><span>🤝 Comisión de tu peña</span><span class="pos">+${fmt(l.commission)}</span></div>` : ''}
            ${l.owner ? `<div class="line"><span>🐴 Premio de dueño</span><span class="pos">+${fmt(l.owner)}</span></div>` : ''}
            ${l.favor ? `<div class="line"><span>🧾 Sabotaje (a tu deuda)</span><span class="mute">${fmt(l.favor)}</span></div>` : ''}
            <div class="line" style="font-weight:600"><span>Resultado</span><span>${signed(l.net)}</span></div>
          </div>` : `<div class="mute" style="font-size:14px;margin-top:8px">No apostaste en esta carrera.</div>`}
      </div>
      ${wins.length ? `<div class="group" style="margin-bottom:12px">${wins.map(w => `<div class="item" style="grid-template-columns:44px 1fr auto">
        <div class="avatar" style="background:var(--card2);font-size:22px">${TYPE_UI[w.type].e}</div>
        <div><div class="t" style="font-size:15px">${esc(pickNames(w.type, w.sel))}</div><div class="s">${TYPE_UI[w.type].name} · ${xs(w.odds)}</div></div>
        <div class="r"><div class="win">+${fmt(w.win)}</div></div></div>`).join('')}</div>` : ''}
      <div class="sec">Podios</div>${podiumsHTML()}`);
  } else res.classList.add('hidden');
}

  const c = state.cfg;
  setHTML('tab-mafia', `<div class="sec">Don Caballone 🕴️</div>

    ${a.members.length < c.maxAllianceSize && others.length ? `<div class="sec">Invitar</div><div class="group">${others.map(p => `<div class="item" style="grid-template-columns:44px 1fr auto">

      <div class="r"><button class="soft blue" data-invite="${p.id}" style="padding:8px 12px">Invitar</button></div></div>`).join('')}</div>` : ''}
    <div class="btnRow"><button class="soft red" data-betray="1">😈 Traicionar</button><button class="soft" data-leave="1">Salir</button></div>
    <div class="mute" style="font-size:13px;margin-top:6px">Traicionar: te llevas el 20 % de las fichas de tus amigos… y todos se enteran.</div>

document.getElementById('game').addEventListener('click', async e => {
  const d = e.target.closest('button')?.dataset; if (!d) return;
  if (d.skin) {
    const owned = (me.skins || []).includes(d.skin), sk = state.cfg.skins[d.skin];
    if (await api(owned ? 'equipSkin' : 'buySkin', { skin: d.skin })) toast(`${sk.icon} ¡Tu potro ahora es ${sk.name}!`);
  } else if (d.buy) { const n = document.getElementById('horseName').value; if (await api('buyHorse', { name: n, perfil: d.buy })) toast(`🐴 ¡${n} es tuyo! ${state.phase === 'apuestas' ? 'Ya está en esta carrera.' : 'Corre en la próxima carrera.'}`); }
  else if (d.enroll) api('enroll', { enrolled: d.enroll === '1' });
  else if (d.train) { if (await api('train', { focus: d.train })) toast('🏋️ ¡A entrenar!'); }
  else if (d.loan) { if (await api('loan', { amount: +d.loan })) toast('🕴️ Don Caballone sonríe…'); }
  else if (d.repay) api('repay', { amount: +d.repay });
  else if (d.create) api('createAlliance');
  else if (d.invite) { if (await api('invite', { to: d.invite })) toast('✉️ Invitación enviada'); }
  else if (d.answer) api('answerInvite', { alliance: d.answer, accept: d.accept === '1' });

});

// Conexión en vivo por WebSocket (los túneles y proxies no la retienen); se reconecta sola
function openStream(query, onMessage, onClosed) {
  let handle = null;
  let sock = null, stopped = false;
  const open = () => {
    sock = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?${query}`);
    sock.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'reply') handle && handle._reply(m); else onMessage(m); };
    sock.onclose = () => { if (stopped) return; if (onClosed) onClosed(); setTimeout(() => !stopped && open(), 1000); };
  };
  open();
  const waiting = new Map();
  let rid = 0;
  return handle = {
    close() { stopped = true; sock && sock.close(); },
    ready: () => sock && sock.readyState === 1,
    // Envía una acción y espera su respuesta (null si no llega en 4 s)
    request(msg) {
      return new Promise(resolve => {
        const id = ++rid;
        const t = setTimeout(() => { waiting.delete(id); resolve(null); }, 4000);
        waiting.set(id, r => { clearTimeout(t); resolve(r); });
        sock.send(JSON.stringify({ ...msg, rid: id }));
      });
    },
    _reply(m) { const f = waiting.get(m.rid); if (f) { waiting.delete(m.rid); f(m); } },
  };
}

let tutoStep = 0;
function showTuto(i) {
  tutoStep = i;
  if (i >= TUTO.length) { document.getElementById('tuto').classList.add('hidden'); store.set('jj_tuto3', '1'); return; }
  const [e, title, text, ex] = TUTO[i];
  document.getElementById('tuto').classList.remove('hidden');
  document.getElementById('tutoK').textContent = `Cómo se juega · ${i + 1} de ${TUTO.length}`;
  document.getElementById('tutoE').textContent = e;
  document.getElementById('tutoTitle').textContent = title;
  document.getElementById('tutoText').innerHTML = text;
  document.getElementById('tutoEx').innerHTML = `<b>Ejemplo:</b> ${ex}`;
  document.getElementById('tutoDots').innerHTML = TUTO.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('');
  document.getElementById('tutoNext').textContent = i === TUTO.length - 1 ? '¡A jugar!' : 'Siguiente';
}
document.getElementById('tutoNext').onclick = () => showTuto(tutoStep + 1);
document.getElementById('tutoSkip').onclick = () => showTuto(TUTO.length);
document.getElementById('helpBtn').onclick = () => showTuto(0);

let es;
function connect() {
  for (const id of ['game', 'nav']) document.getElementById(id).classList.remove('hidden');
  document.getElementById('login').classList.add('hidden');
  if (!store.get('jj_tuto3')) showTuto(0);
  if (es) es.close();
  es = openStream(`sala=${encodeURIComponent(sala)}&id=${encodeURIComponent(myId)}`, m => {
    if (m.type !== 'state') return;
    if (m.build && !PAGE_BUILD.startsWith('__') && m.build !== PAGE_BUILD) { location.reload(); return; } // el servidor se actualizó
    if (lastRaceKey && lastRaceKey !== m.raceKey) { selHorse = null; picks = []; tip = TIPS[Math.floor(Math.random() * TIPS.length)]; }
    lastRaceKey = m.raceKey;
    state = m;
    if (m.me) { me = m.me; drawReactions(); render(); return; }
    // Cuenta conocida pero todavía no está en esta sala: entrar con el mismo nombre
    if (!joining) { joining = true; api('join', {}).then(j => { joining = false; if (!j) backToLogin(); }); }
  }, async () => {
    // Si la sala ya no existe (el anfitrión cerró el juego), volver a la entrada
    const r = await fetch(`/api/track?sala=${encodeURIComponent(sala)}`).catch(() => ({ ok: true }));
    if (!r.ok) backToLogin('La sala ya no existe. Pide el código nuevo.');
  });
}
function backToLogin(text) {
  if (es) es.close();
  for (const id of ['game', 'nav', 'dock', 'reactBox']) document.getElementById(id).classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('salaIn').style.display = '';
  if (text) toast(text);
}

if (myId && sala) connect();

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Jackpot Jockeys</title>
<style>
  /* Estilo iOS: tipografía del sistema, listas agrupadas, tarjetas redondeadas y modo claro/oscuro */
  :root {
    --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --sep: #38383a; --txt: #fff; --mute: #8e8e93;
    --accent: #ffcc00; --accentTxt: #1c1c1e; --green: #30d158; --red: #ff453a; --blue: #0a84ff; --orange: #ff9f0a;
    --blur: rgba(22,22,24,0.78); --r: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f2f7; --card: #fff; --card2: #e5e5ea; --sep: #d1d1d6; --txt: #000; --mute: #6e6e73;
      --accent: #ffcc00; --accentTxt: #1c1c1e; --green: #34c759; --red: #ff3b30; --blue: #007aff; --orange: #ff9500;
      --blur: rgba(249,249,251,0.82); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0 auto; max-width: 560px; background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    font-size: 17px; line-height: 1.3; padding: 0 16px calc(var(--dock, 0px) + 90px); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .35; }
  .hidden { display: none !important; }
  .mute { color: var(--mute); }
  .pos { color: var(--green); } .neg { color: var(--red); }

  /* ─── Entrada ─── */
  #login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px 4px; }
  #login .logo { font-size: 64px; text-align: center; }
  #login h1 { font-size: 34px; font-weight: 800; text-align: center; margin: 0; letter-spacing: -.5px; }
  #login p { text-align: center; color: var(--mute); margin: 0 0 12px; font-size: 16px; }
  input { width: 100%; font: inherit; font-size: 19px; padding: 16px; border-radius: 14px; border: 0; background: var(--card); color: var(--txt); outline: none; }
  input:focus { box-shadow: 0 0 0 3px rgba(255,204,0,0.45); }
  .big { width: 100%; padding: 17px; border-radius: 14px; background: var(--accent); color: var(--accentTxt); font-weight: 700; font-size: 18px; }
  .big:active { transform: scale(.98); }
  .big.green { background: var(--green); color: #fff; }
  .big.gray { background: var(--card2); color: var(--txt); }

  /* ─── Barra superior translúcida ─── */
  #top { position: sticky; top: 0; z-index: 5; margin: 0 -16px 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: var(--blur); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
  #coins { font-size: 28px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  #who { font-size: 13px; color: var(--mute); }
  #debtTag { display: inline-block; margin-left: 6px; font-size: 13px; font-weight: 600; color: var(--red); }
  .roundBtn { width: 36px; height: 36px; border-radius: 50%; background: var(--card2); font-size: 18px; font-weight: 700; }
  #status { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  #status b { font-size: 16px; }
  #status .pill { font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 20px; background: var(--card2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #status.gp { background: linear-gradient(90deg, rgba(255,204,0,.25), var(--card)); }

  /* ─── Secciones y listas agrupadas ─── */
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .3px; color: var(--mute); margin: 18px 4px 8px; font-weight: 500; }
  .sec b { color: var(--txt); text-transform: none; font-size: 15px; }
  .group { background: var(--card); border-radius: var(--r); overflow: hidden; }
  .item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; min-height: 60px; width: 100%; text-align: left; position: relative; }
  .item + .item::before { content: ''; position: absolute; left: 70px; right: 0; top: 0; border-top: .5px solid var(--sep); }
  .item:active { background: var(--card2); }
  .item.sel { background: rgba(255,204,0,0.16); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; position: relative; }
  .avatar .sk { position: absolute; right: -4px; bottom: -4px; font-size: 20px; }
  .item .t { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .r { text-align: right; }
  .item .win { font-weight: 700; font-size: 16px; color: var(--green); font-variant-numeric: tabular-nums; }
  .item .x { font-size: 12px; color: var(--mute); }
  .badge { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: var(--accent); color: var(--accentTxt); font-weight: 800; font-size: 14px; }
  .mine { font-size: 12px; color: var(--green); font-weight: 600; }

  /* Tipos de apuesta: fichas grandes deslizables */
  #types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .type { text-align: left; background: var(--card); border-radius: 14px; padding: 8px 10px; border: 2px solid transparent; min-width: 0; }
  .type .e { font-size: 22px; line-height: 1.1; }
  .type b { display: block; font-size: 14px; margin-top: 2px; }
  .type small { display: block; font-size: 12px; color: var(--mute); line-height: 1.2; margin-top: 2px; }
  .type.sel { border-color: var(--accent); background: rgba(255,204,0,0.14); }

  /* ─── Panel inferior fijo (boleto / poderes) ─── */
  #dock { position: fixed; left: 0; right: 0; bottom: calc(57px + env(safe-area-inset-bottom)); z-index: 6; padding: 10px 16px 12px;
    background: var(--blur); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--sep); }
  #dock .inner { max-width: 528px; margin: 0 auto; }
  #slipTxt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; margin-bottom: 8px; }
  #slipTxt b { font-size: 16px; }
  #amounts { display: flex; gap: 6px; margin-bottom: 8px; }
  #amounts button { flex: 1; padding: 9px 0; border-radius: 10px; background: var(--card2); font-weight: 600; font-size: 15px; }
  #amounts button.sel { background: var(--txt); color: var(--bg); }
  .rowBtns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .rowBtns .big { padding: 15px 8px; font-size: 17px; }
  #powers { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  #powers::-webkit-scrollbar { display: none; }
  .pw { flex: none; width: 82px; padding: 10px 6px; border-radius: 14px; background: var(--card2); text-align: center; }
  .pw .e { font-size: 30px; line-height: 1.1; }
  .pw b { display: block; font-size: 13px; margin-top: 2px; }
  .pw small { display: block; font-size: 12px; color: var(--mute); }
  .pw.bad small { color: var(--red); }
  .pw:active { transform: scale(.95); }

  /* ─── Tarjetas de resultados y en vivo ─── */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 2px 0 4px; font-size: 26px; letter-spacing: -.3px; }
  .card .k { font-size: 13px; text-transform: uppercase; color: var(--mute); letter-spacing: .3px; }
  .hero { font-size: 34px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: .5px solid var(--sep); font-size: 15px; }
  .line:first-of-type { border-top: 0; }
  .btnRow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .btnRow.three { grid-template-columns: 1fr 1fr 1fr; }
  .soft { padding: 13px 8px; border-radius: 12px; background: var(--card2); font-weight: 600; font-size: 15px; }
  .soft.red { color: var(--red); } .soft.green { color: var(--green); } .soft.blue { color: var(--blue); }
  .shop { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .skin { background: var(--card2); border-radius: 14px; padding: 10px 6px; text-align: center; border: 2px solid transparent; }
  .skin .e { font-size: 34px; }
  .skin b { display: block; font-size: 13px; margin-top: 2px; }
  .skin small { display: block; font-size: 12px; color: var(--mute); }
  .skin.on { border-color: var(--accent); }

  /* ─── Barra de pestañas iOS ─── */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 0 calc(env(safe-area-inset-bottom) + 4px); background: var(--blur);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); }
  nav button { display: grid; justify-items: center; gap: 1px; font-size: 11px; color: var(--mute); padding: 2px 0; position: relative; }
  nav button .e { font-size: 22px; filter: grayscale(1); opacity: .7; }
  nav button.on { color: var(--txt); font-weight: 600; }
  nav button.on .e { filter: none; opacity: 1; }
  nav .dot { position: absolute; top: 0; right: 30%; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }

  /* Reacciones: botón en la barra superior que abre un panel */
  #reactBox { position: fixed; right: 16px; top: calc(env(safe-area-inset-top) + 62px); z-index: 8; background: var(--card);
    border-radius: 18px; padding: 8px; display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #reactBox button { height: 52px; border-radius: 12px; font-size: 28px; }
  #reactBox button:active { background: var(--card2); transform: scale(.92); }

  /* Avisos y tutorial */
  #msg { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); z-index: 20; max-width: 92%;
    background: var(--card); color: var(--txt); padding: 12px 18px; border-radius: 22px; font-size: 15px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none; text-align: center; }
  #tuto { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; align-items: flex-end; }
  #tuto .sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom) + 18px); }
  #tuto .e { font-size: 54px; }
  #tuto h2 { font-size: 26px; margin: 6px 0 8px; letter-spacing: -.3px; }
  #tuto p { font-size: 17px; line-height: 1.45; color: var(--mute); margin: 0 0 16px; }
  #tuto p b { color: var(--txt); }
  #tuto .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  #tuto .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--sep); }
  #tuto .dots i.on { background: var(--txt); }
  #tuto .rowBtns { grid-template-columns: 1fr 2fr; }
</style>
</head>
<body>

<div id="login">
  <div class="logo">🏇</div>
  <h1>Jackpot Jockeys</h1>
  <p>Apuesta a caballos que piensan solos.</p>
  <input id="salaIn" placeholder="Código de la sala" maxlength="4" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;text-align:center;letter-spacing:6px">
  <input id="nameIn" placeholder="Tu nombre" maxlength="16" autocomplete="off">
  <button class="big" id="joinBtn">Entrar a jugar</button>
</div>

<div id="game" class="hidden">
  <div id="top">
    <div><div id="who"></div><div id="coins">🪙 0</div></div>
    <div style="display:flex;gap:8px"><button class="roundBtn" id="fab" aria-label="Reacciones">😂</button><button class="roundBtn" id="helpBtn" aria-label="Cómo se juega">?</button></div>
  </div>
  <div id="status"><b id="statusTxt"></b><span class="pill" id="statusPill"></span></div>

  <section id="tab-carrera">
    <div id="results" class="hidden"></div>
    <div id="live" class="hidden"></div>
    <div id="betArea">
      <div class="sec">① ¿Qué apuestas?</div>
      <div id="types"></div>
    </div>
    <div class="sec" id="horsesTitle"></div>
    <div class="group" id="horses"></div>
    <div id="tickets"></div>
  </section>
  <section id="tab-caballo" class="hidden"></section>
  <section id="tab-mafia" class="hidden"></section>
  <section id="tab-pena" class="hidden"></section>
</div>

<div id="dock" class="hidden"><div class="inner">
  <div id="betDock">
    <div id="slipTxt"></div>
    <div id="amounts"></div>
    <div class="rowBtns"><button class="big" id="betBtn">Apostar</button><button class="big gray" id="readyBtn">Listo</button></div>
  </div>
  <div id="powerDock" class="hidden">
    <div id="powerTxt" style="font-size:15px;margin-bottom:8px"></div>
    <div id="powers"></div>
  </div>
</div></div>

<div id="reactBox" class="hidden"></div>

<nav id="nav" class="hidden">
  <button data-tab="carrera" class="on"><span class="e">🏇</span>Carrera</button>
  <button data-tab="caballo"><span class="e">🐴</span>Mi caballo</button>
  <button data-tab="mafia"><span class="e">💼</span>Mafia</button>
  <button data-tab="pena"><span class="e">🤝</span>Peña</button>
</nav>

<div id="tuto" class="hidden"><div class="sheet">
  <div class="dots" id="tutoDots"></div>
  <div class="e" id="tutoE"></div>
  <h2 id="tutoTitle"></h2>
  <p id="tutoText"></p>
  <div class="rowBtns"><button class="big gray" id="tutoSkip">Saltar</button><button class="big" id="tutoNext">Siguiente</button></div>
</div></div>

<div id="msg"></div>

<script>
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);
let sala = (params.get('sala') || store.get('jj_sala') || '').toUpperCase();
let myId = store.get('jj_id');
let state = null, me = null, selHorse = null, amount = 100, lastRaceKey = null, joining = false, showTickets = false;
let betType = 'ganador', picks = []; // apuesta en preparación: tipo y caballos en orden (1º, 2º, 3º)
const ORD = ['1º', '2º', '3º'];

// Tipos de apuesta en palabras sencillas
const TYPE_UI = {
  ganador: { e: '🥇', name: 'Que gane', how: 'Elige el caballo que crees que llega primero' },
  place: { e: '🥈', name: 'Top 2', how: 'Elige un caballo que llegue 1º o 2º' },
  podio: { e: '🥉', name: 'Podio', how: 'Elige un caballo que llegue entre los 3 primeros' },
  quiniela: { e: '👯', name: 'Pareja', how: 'Elige los 2 que llegan primero, en cualquier orden' },
  exacta: { e: '🎯', name: '1º y 2º', how: 'Elige quién llega 1º y luego quién llega 2º' },
  trifecta: { e: '🏆', name: '1º, 2º y 3º', how: 'Elige el 1º, el 2º y el 3º, en orden. ¡Paga muchísimo!' },
};

// Las mismas cuotas que calcula la casa (cuotas.js): Harville + margen, con las probabilidades del servidor
function orderedProb(p, sel) { let prob = 1, used = 0; for (const i of sel) { prob *= p[i] / (1 - used); used += p[i]; } return prob; }
function betProb(type, sel, p) {
  const n = p.length, others = i => [...Array(n).keys()].filter(x => x !== i), i = sel[0];
  if (type === 'ganador') return p[i];
  if (type === 'place') return p[i] + others(i).reduce((a, j) => a + orderedProb(p, [j, i]), 0);
  if (type === 'podio') { let r = p[i]; for (const j of others(i)) { r += orderedProb(p, [j, i]); for (const k of others(i)) if (k !== j) r += orderedProb(p, [j, k, i]); } return r; }
  if (type === 'quiniela') return orderedProb(p, [sel[0], sel[1]]) + orderedProb(p, [sel[1], sel[0]]);
  return orderedProb(p, sel);
}
function quote(type, sel) {
  const prob = betProb(type, sel, state.probs);
  return +Math.min(5000, Math.max(1.05, (1 - state.margin) / prob * state.gpBonus)).toFixed(2);
}
// Pago máximo de un tipo (para decirle al jugador "hasta cuánto paga")
function maxOdds(type, picks) {
  const n = state.horses.length;
  let best = 0;
  const rec = sel => { if (sel.length === picks) { best = Math.max(best, quote(type, sel)); return; } for (let i = 0; i < n; i++) if (!sel.includes(i)) rec([...sel, i]); };
  rec([]);
  return best;
}
const TIPS = [
  'Lo que dice tu boleto es lo que ganas, aunque los demás apuesten.',
  'Las cuotas salen de simular esta carrera 100 veces con los mismos caballos.',
  '"Top 2" y "Podio" ganan seguido pero pagan poco. "1º, 2º y 3º" casi nunca… pero paga una fortuna.',
  'Los poderes cuestan fichas: úsalos cuando tu caballo lo valga.',
  'La mafia presta, pero se lleva la mitad de lo que ganes hasta que pagues.',
];
let tip = TIPS[Math.floor(Math.random() * TIPS.length)];
const xs = n => 'x' + (n >= 100 ? Math.round(n).toLocaleString('es') : n.toFixed(n >= 10 ? 1 : 2));
const pickNames = (type, sel) => sel.map(i => state.horses[i].name).join(type === 'quiniela' ? ' y ' : ' → ');
const AMOUNTS = [10, 50, 100, 250, 'Todo'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n).toLocaleString('es');
const signed = n => `<span class="${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? '+' : ''}${fmt(n)}</span>`;
const setHTML = (id, html) => { const el = document.getElementById(id); if (el._h !== html) { el.innerHTML = html; el._h = html; } };
const skinIcon = h => h.skin && h.skin !== 'normal' && state.cfg.skins[h.skin] ? state.cfg.skins[h.skin].icon : '';
const betAmount = () => amount === 'Todo' ? me.coins : Math.min(amount, me.coins);

document.getElementById('salaIn').value = sala;
if (params.get('sala')) document.getElementById('salaIn').style.display = 'none';

function toast(text) {
  const m = document.getElementById('msg');
  m.textContent = text; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 2400);
}
const tap = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };

async function api(action, body = {}) {
  // Por la conexión abierta es inmediato; si no hay conexión, por HTTP. No se reintenta por HTTP
  // una acción ya enviada, para no duplicar apuestas si la respuesta se demora.
  let j;
  if (es && es.ready() && action !== 'join') {
    j = await es.request({ action, ...body });
    if (!j) { toast('La conexión está lenta: revisa en un momento si se aplicó.'); return null; }
  } else j = await fetch('/api/' + action, { method: 'POST', body: JSON.stringify({ sala, id: myId, ...body }) }).then(r => r.json());
  if (j.error) { toast(j.error); return null; }
  return j;
}

document.getElementById('joinBtn').onclick = async () => {
  sala = document.getElementById('salaIn').value.trim().toUpperCase();
  if (sala.length !== 4) return toast('El código tiene 4 letras: míralo en la pantalla grande');
  const j = await api('join', { name: document.getElementById('nameIn').value });
  if (j) { myId = j.id; store.set('jj_id', myId); store.set('jj_sala', sala); connect(); }
};

// ─── Acciones de la pestaña Carrera ───
document.getElementById('betBtn').onclick = async () => {
  const n = state.pools[betType].picks;
  if (picks.length !== n) return toast(n === 1 ? 'Primero elige un caballo' : `Elige ${n} caballos`);
  const a = betAmount();
  if (a <= 0) return toast('No tienes fichas. La mafia presta…');
  tap();
  if (await api('bet', { type: betType, sel: picks, amount: a })) { toast(`¡Apostado! ${TYPE_UI[betType].e} ${pickNames(betType, picks)}`); picks = []; render(); }
};
document.getElementById('readyBtn').onclick = () => { tap(); api('ready', { ready: !me.ready }); };
document.getElementById('types').onclick = e => {
  const b = e.target.closest('.type'); if (!b) return;
  betType = b.dataset.t;
  picks = picks.slice(0, state.pools[betType].picks);
  render();
};
document.getElementById('amounts').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  amount = b.dataset.a === 'Todo' ? 'Todo' : +b.dataset.a; render();
};
document.getElementById('powers').onclick = e => {
  const b = e.target.closest('.pw'); if (!b || b.disabled) return;
  if (selHorse == null) return toast('Primero toca un caballo de la lista');
  tap();
  const k = b.dataset.k;
  if (k === 'mafia') return api('mafiaFavor', { horse: selHorse }).then(j => j && toast('🕴️ Don Caballone se encarga.'));
  api('power', { power: k, horse: selHorse }).then(j => j && toast(`${state.powers[k].icon} ${state.powers[k].name} para ${state.horses[selHorse].name}`));
};
document.getElementById('horses').onclick = e => {
  const el = e.target.closest('.item'); if (!el) return;
  const i = +el.dataset.i;
  tap();
  if (state.phase === 'apuestas') {
    // Elegir caballos en orden: tocar de nuevo uno elegido lo quita
    const n = state.pools[betType].picks;
    if (n === 1) picks = picks[0] === i ? [] : [i];
    else if (picks.includes(i)) picks = picks.filter(x => x !== i);
    else if (picks.length < n) picks.push(i);
    else picks[n - 1] = i;
  } else selHorse = selHorse === i ? null : i;
  render();
};

// ─── Render ───
function render() {
  if (!state || !me) return;
  const s = state;
  document.getElementById('who').textContent = `${me.name} · sala ${s.sala}`;
  document.getElementById('coins').innerHTML = `🪙 ${fmt(me.coins)}${me.debt ? `<span id="debtTag">debes ${fmt(me.debt)}</span>` : ''}`;
  const status = document.getElementById('status');
  status.classList.toggle('gp', !!s.grandPrix);
  const raceName = s.grandPrix ? '🏆 Gran Premio' : `Carrera ${s.match.race} de ${s.match.total}`;
  const st = {
    apuestas: [raceName, s.timeLeft != null ? `Arranca en ${s.timeLeft}` : !s.oddsReady ? 'Preparando…' : `${s.readyCount}/${s.onlineCount} listos`],
    carrera: ['🏁 ¡Están corriendo!', `${s.laps} vueltas`],
    resultados: ['🏆 Resultados', `${s.timeLeft}s`],
    final: ['🎉 Fin de la partida', `${s.timeLeft}s`],
  }[s.phase];
  document.getElementById('statusTxt').textContent = st[0];
  document.getElementById('statusPill').textContent = st[1];

  const dots = { pena: me.invites.length > 0, mafia: me.debt > 0, caballo: !!(me.horse && me.horse.training) };
  document.querySelectorAll('nav button').forEach(b => {
    const d = dots[b.dataset.tab];
    if (d && !b.querySelector('.dot')) b.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
    if (!d) b.querySelector('.dot')?.remove();
  });
  renderCarrera(); renderCaballo(); renderMafia(); renderPena();
  // El panel inferior solo en la pestaña Carrera
  const onCarrera = !document.getElementById('tab-carrera').classList.contains('hidden');
  const dockOn = onCarrera && (s.phase === 'apuestas' || s.phase === 'carrera');
  document.getElementById('dock').classList.toggle('hidden', !dockOn);
  const h = dockOn ? document.getElementById('dock').offsetHeight : 0;
  document.body.style.setProperty('--dock', h + 'px');
}

function renderCarrera() {
  const s = state, betting = s.phase === 'apuestas', racing = s.phase === 'carrera';
  const T = s.pools[betType], U = TYPE_UI[betType];
  document.getElementById('betArea').classList.toggle('hidden', !betting);
  document.getElementById('betDock').classList.toggle('hidden', !betting);
  document.getElementById('powerDock').classList.toggle('hidden', !racing);

  // ① Tipos de apuesta con "hasta cuánto paga"
  setHTML('types', Object.entries(TYPE_UI).map(([k, u]) =>
    `<button class="type ${betType === k ? 'sel' : ''}" data-t="${k}"><div class="e">${u.e}</div><b>${u.name}</b><small>${s.oddsReady ? `hasta ${xs(maxOdds(k, s.pools[k].picks))}` : '…'}</small></button>`).join(''));

  // ② Caballos
  document.getElementById('horsesTitle').innerHTML = betting ? `② <b>${esc(U.how)}</b>` : racing ? 'Toca un caballo para ayudarlo o molestarlo' : 'Llegada';
  const rows = s.horses.map((h, i) => ({ h, i }));
  if (!betting) rows.sort((a, b) => a.h.pos - b.h.pos);
  const a = betAmount();
  setHTML('horses', rows.map(({ h, i }) => {
    const pk = picks.indexOf(i), chosen = betting ? pk >= 0 : selHorse === i;
    const mine = me.tickets.filter(tk => tk.sel.includes(i)).reduce((x, tk) => x + tk.amount, 0);
    let right = '';
    if (betting && s.oddsReady) {
      if (T.picks === 1) { const q = quote(betType, [i]); right = `<div class="win">gana ${fmt(Math.floor(q * a))}</div><div class="x">${xs(q)}</div>`; }
      else right = pk >= 0 ? `<span class="badge">${betType === 'quiniela' ? '✓' : ORD[pk]}</span>` : `<div class="x">${xs(h.odds)} solo</div>`;
    } else if (!betting) right = `<span class="badge" style="background:var(--card2);color:var(--txt)">${h.pos}º</span>`;
    const sub = betting
      ? (h.ownerName ? `de ${esc(h.ownerName)}` : esc(h.estilo[0].toUpperCase() + h.estilo.slice(1)))
      : `vuelta ${h.lap}/${s.laps}${h.hits ? ` · ${h.hits} choques` : ''}`;
    return `<button class="item ${chosen ? 'sel' : ''}" data-i="${i}">
      <div class="avatar" style="background:${h.color}">${i + 1}${skinIcon(h) ? `<span class="sk">${skinIcon(h)}</span>` : ''}</div>
      <div><div class="t">${esc(h.name)}</div><div class="s">${sub}${mine ? ` · <span class="mine">🎟 ${fmt(mine)}</span>` : ''}</div></div>
      <div class="r">${right}</div></button>`;
  }).join(''));

  // ③ Boleto en el panel inferior
  if (betting) {
    let txt;
    if (!s.oddsReady) txt = `<span class="mute">⏳ La casa está calculando las cuotas… ${esc(tip)}</span>`;
    else if (picks.length === T.picks) {
      const q = quote(betType, picks);
      txt = `<span>${U.e} <b>${esc(pickNames(betType, picks))}</b></span><span class="mute">${xs(q)}</span>`;
    } else txt = `<span class="mute">${U.e} ${T.picks === 1 ? 'Toca un caballo de la lista' : `Elegidos ${picks.length} de ${T.picks}`}</span>`;
    setHTML('slipTxt', txt);
    setHTML('amounts', AMOUNTS.map(v => `<button data-a="${v}" class="${amount === v ? 'sel' : ''}">${v}</button>`).join(''));
    const bb = document.getElementById('betBtn');
    const ready = s.oddsReady && picks.length === T.picks && a > 0;
    bb.disabled = !ready;
    bb.textContent = ready ? `Apostar ${fmt(a)} · ganas ${fmt(Math.floor(quote(betType, picks) * a))}` : `Apostar ${fmt(a)}`;
    const rb = document.getElementById('readyBtn');
    rb.textContent = me.ready ? '✓ Listo' : 'Listo';
    rb.className = 'big ' + (me.ready ? 'green' : 'gray');
  }

  // En carrera: poderes
  if (racing) {
    const target = selHorse != null ? s.horses[selHorse] : null;
    setHTML('powerTxt', target ? `Poder para <b>${esc(target.name)}</b>` : '<span class="mute">Toca un caballo de la lista y luego un poder</span>');
    const cd = me.cooldown || 0;
    setHTML('powers', Object.entries(s.powers).map(([k, p]) =>
      `<button class="pw ${p.debuff ? 'bad' : ''}" data-k="${k}" ${me.coins < p.cost || cd > 0 ? 'disabled' : ''}><div class="e">${p.icon}</div><b>${esc(p.name)}</b><small>🪙 ${p.cost}</small></button>`).join('')
      + `<button class="pw bad" data-k="mafia" ${me.favorUsed || me.debt + s.cfg.mafiaFavorCost > s.cfg.maxDebt ? 'disabled' : ''}><div class="e">🕴️</div><b>Mafia</b><small>+${s.cfg.mafiaFavorCost} deuda</small></button>`);
  }

  // En vivo: cuánto ganarías si terminara ahora
  const live = document.getElementById('live');
  if (racing && me.tickets.length && me.live) {
    live.classList.remove('hidden');
    const spent = me.race.bets + me.race.powers, got = me.live.gross - me.live.mafia;
    setHTML('live', `<div class="card"><div class="k">Si terminara ahora</div>
      <div class="hero ${me.live.gross ? 'pos' : 'mute'}">${me.live.gross ? `Ganas ${fmt(me.live.gross)}` : 'Todavía no ganas'}</div>
      <div class="mute" style="font-size:14px">Pusiste ${fmt(spent)} · resultado ${signed(got - spent)}${me.live.mafia ? ` · la mafia se lleva ${fmt(me.live.mafia)}` : ''}</div></div>`);
  } else live.classList.add('hidden');

  // Mis boletos
  if ((betting || racing) && me.tickets.length) {
    const best = me.tickets.reduce((x, tk) => x + tk.ifHit, 0);
    setHTML('tickets', `<div class="sec">Mis boletos · si aciertan ganas hasta <b>${fmt(best)}</b></div><div class="group">${me.tickets.map(tk =>
      `<div class="item" style="grid-template-columns:44px 1fr auto"><div class="avatar" style="background:var(--card2);font-size:22px">${TYPE_UI[tk.type].e}</div>
        <div><div class="t" style="font-size:15px">${esc(pickNames(tk.type, tk.sel))}</div><div class="s">${TYPE_UI[tk.type].name} · ${xs(tk.odds)} · pusiste ${fmt(tk.amount)}</div></div>
        <div class="r"><div class="win">${fmt(tk.ifHit)}</div></div></div>`).join('')}</div>`);
  } else setHTML('tickets', '');

  // Resultados
  const res = document.getElementById('results');
  if ((s.phase === 'resultados' || s.phase === 'final') && s.results) {
    const r = s.results, wins = r.payouts.filter(p => p.id === me.id);
    const won = wins.reduce((x, p) => x + p.win, 0), l = me.lastRace;
    res.classList.remove('hidden');
    setHTML('results', `<div class="card" style="text-align:center">
        <div class="k">${r.grandPrix ? 'Ganó el Gran Premio' : 'Ganó'}</div>
        <h2>${skinIcon(s.horses[r.winner])} ${esc(s.horses[r.winner].name)}</h2>
        <div class="mute" style="font-size:14px">${esc(r.quip || '')}</div>
        ${l ? `<div class="hero ${l.net > 0 ? 'pos' : l.net < 0 ? 'neg' : 'mute'}" style="margin-top:10px">${l.net > 0 ? '🎉 ' : l.net < 0 ? '😢 ' : ''}${signed(l.net)}</div>
          <div class="mute" style="font-size:14px">${won ? `Ganaste ${fmt(won)}` : 'Esta vez no acertaste'} · pusiste ${fmt(l.bets + l.powers)}${l.mafia ? ` · la mafia se llevó ${fmt(l.mafia)}` : ''}</div>` : ''}
      </div>
      ${wins.length ? `<div class="group" style="margin-bottom:12px">${wins.map(w => `<div class="item" style="grid-template-columns:44px 1fr auto">
        <div class="avatar" style="background:var(--card2);font-size:22px">${TYPE_UI[w.type].e}</div>
        <div><div class="t" style="font-size:15px">${esc(pickNames(w.type, w.sel))}</div><div class="s">${TYPE_UI[w.type].name} · ${xs(w.odds)}</div></div>
        <div class="r"><div class="win">+${fmt(w.win)}</div></div></div>`).join('')}</div>` : ''}
      ${s.phase === 'final' && s.awards ? `<div class="sec">Premios de la noche</div><div class="group">${s.awards.map(a =>
        `<div class="item" style="grid-template-columns:44px 1fr auto"><div class="avatar" style="background:var(--card2);font-size:22px">🏅</div>
          <div><div class="t" style="font-size:15px">${esc(a.title)}</div><div class="s">${esc(a.desc)}</div></div><div class="r"><b>${esc(a.name)}</b></div></div>`).join('')}</div>
        <p class="mute" style="font-size:14px;text-align:center">Nueva partida en ${s.timeLeft}s: todos vuelven a 1.000 fichas.</p>` : ''}`);
  } else res.classList.add('hidden');
}

document.getElementById('nav').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  for (const t of ['carrera', 'caballo', 'mafia', 'pena']) document.getElementById('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab);
  window.scrollTo(0, 0);
  render();
};
document.getElementById('game').addEventListener('click', async e => {
  const d = e.target.closest('button')?.dataset; if (!d) return;
  if (d.skin) {
    const owned = (me.skins || []).includes(d.skin), sk = state.cfg.skins[d.skin];
    if (await api(owned ? 'equipSkin' : 'buySkin', { skin: d.skin })) toast(`${sk.icon} ¡Tu potro ahora es ${sk.name}!`);
  } else if (d.buy) { const n = document.getElementById('horseName').value; if (await api('buyHorse', { name: n, perfil: d.buy })) toast(`🐴 ¡${n} es tuyo!`); }
  else if (d.enroll) api('enroll', { enrolled: d.enroll === '1' });
  else if (d.train) { if (await api('train', { focus: d.train })) toast('🏋️ ¡A entrenar!'); }
  else if (d.loan) { if (await api('loan', { amount: +d.loan })) toast('🕴️ Don Caballone sonríe…'); }
  else if (d.repay) api('repay', { amount: +d.repay });
  else if (d.create) api('createAlliance');
  else if (d.invite) { if (await api('invite', { to: d.invite })) toast('✉️ Invitación enviada'); }
  else if (d.answer) api('answerInvite', { alliance: d.answer, accept: d.accept === '1' });
  else if (d.gift) api('gift', { to: d.gift, amount: +d.amt });
  else if (d.leave) api('leaveAlliance');
  else if (d.betray) { if (confirm('¿Seguro? Toda la sala se va a enterar.')) api('betray'); }
});

// Conexión en vivo por WebSocket (los túneles y proxies no la retienen); se reconecta sola
function openStream(query, onMessage, onClosed) {
  let handle = null;
  let sock = null, stopped = false;
  const open = () => {
    sock = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?${query}`);
    sock.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'reply') handle && handle._reply(m); else onMessage(m); };
    sock.onclose = () => { if (stopped) return; if (onClosed) onClosed(); setTimeout(() => !stopped && open(), 1000); };
  };
  open();
  const waiting = new Map();
  let rid = 0;
  return handle = {
    close() { stopped = true; sock && sock.close(); },
    ready: () => sock && sock.readyState === 1,
    // Envía una acción y espera su respuesta (null si no llega en 4 s)
    request(msg) {
      return new Promise(resolve => {
        const id = ++rid;
        const t = setTimeout(() => { waiting.delete(id); resolve(null); }, 4000);
        waiting.set(id, r => { clearTimeout(t); resolve(r); });
        sock.send(JSON.stringify({ ...msg, rid: id }));
      });
    },
    _reply(m) { const f = waiting.get(m.rid); if (f) { waiting.delete(m.rid); f(m); } },
  };
}

const TUTO = [
  ['🏇', 'Los caballos piensan solos', 'Cada caballo es una <b>red neuronal</b> que aprendió a correr. Tú no los manejas: <b>apuestas</b> a cuál va a ganar.'],
  ['🥇', 'Apuesta en 3 toques', '① Elige <b>qué apuestas</b> (que gane, top 2, podio…). ② Toca tu <b>caballo</b>. ③ Elige <b>cuánto</b> y toca <b>Apostar</b>. El botón te dice cuánto ganas si aciertas.'],
  ['🏆', 'Lo difícil paga más', 'Que tu caballo quede en el podio es fácil y paga poco. Adivinar <b>1º, 2º y 3º</b> en orden es dificilísimo… y puede pagar <b>x1.000</b>.'],
  ['✅', 'Todos deciden cuándo', 'Cuando todos tocan <b>Listo</b>, la carrera arranca. No hay prisa.'],
  ['🥕', 'Ayuda o molesta', 'Durante la carrera toca un caballo y lánzale un poder: 🥕 lo acelera, 🪢 lo frena, ⚡ congela a todos los demás.'],
  ['🕴️', 'Mafia, peñas y tu caballo', '¿Sin fichas? La <b>mafia</b> presta (y cobra caro). Arma una <b>peña</b> con amigos. Compra tu propio <b>potro</b> y disfrázalo de T-Rex 🦖.'],
];
let tutoStep = 0;
function showTuto(i) {
  tutoStep = i;
  if (i >= TUTO.length) { document.getElementById('tuto').classList.add('hidden'); store.set('jj_tuto2', '1'); return; }
  document.getElementById('tuto').classList.remove('hidden');
  document.getElementById('tutoE').textContent = TUTO[i][0];
  document.getElementById('tutoTitle').textContent = TUTO[i][1];
  document.getElementById('tutoText').innerHTML = TUTO[i][2];
  document.getElementById('tutoDots').innerHTML = TUTO.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  document.getElementById('tutoNext').textContent = i === TUTO.length - 1 ? '¡A jugar!' : 'Siguiente';
}
document.getElementById('tutoNext').onclick = () => showTuto(tutoStep + 1);
document.getElementById('tutoSkip').onclick = () => showTuto(TUTO.length);
document.getElementById('helpBtn').onclick = () => showTuto(0);

let es;
function connect() {
  for (const id of ['game', 'nav']) document.getElementById(id).classList.remove('hidden');
  document.getElementById('login').classList.add('hidden');
  if (!store.get('jj_tuto2')) showTuto(0);
  if (es) es.close();
  es = openStream(`sala=${encodeURIComponent(sala)}&id=${encodeURIComponent(myId)}`, m => {
    if (m.type !== 'state') return;
    if (lastRaceKey && lastRaceKey !== m.raceKey) { selHorse = null; picks = []; tip = TIPS[Math.floor(Math.random() * TIPS.length)]; }
    lastRaceKey = m.raceKey;
    state = m;
    if (m.me) { me = m.me; drawReactions(); render(); return; }
    // Cuenta conocida pero todavía no está en esta sala: entrar con el mismo nombre
    if (!joining) { joining = true; api('join', {}).then(j => { joining = false; if (!j) backToLogin(); }); }
  }, async () => {
    // Si la sala ya no existe (el anfitrión cerró el juego), volver a la entrada
    const r = await fetch(`/api/track?sala=${encodeURIComponent(sala)}`).catch(() => ({ ok: true }));
    if (!r.ok) backToLogin('La sala ya no existe. Pide el código nuevo.');
  });
}
function backToLogin(text) {
  if (es) es.close();
  for (const id of ['game', 'nav', 'dock', 'reactBox']) document.getElementById(id).classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('salaIn').style.display = '';
  if (text) toast(text);
}

if (myId && sala) connect();
</script>
</body>
</html>

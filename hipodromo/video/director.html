<!doctype html>
<meta charset="utf-8">
<title>Director del video</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b1f15; font-family: 'Avenir Next', 'Segoe UI', sans-serif; }
  iframe { position: absolute; border: 0; }
  #big, .mundo { left: 0; top: 0; width: 1280px; height: 720px; }
  .mundo { opacity: 0; transition: opacity .35s; background: #0b1f15; }
  .mundo.on { opacity: 1; }
  #phoneBox { position: absolute; right: 26px; top: 20px; width: 300px; height: 590px; padding: 8px; background: #0a0a0a; border-radius: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.7), 0 0 0 2px #444;
    transform: translateX(380px); transition: transform .5s cubic-bezier(.2,1,.3,1); overflow: hidden; }
  #phoneBox.on { transform: none; }
  #phone { left: 8px; top: 8px; width: 390px; height: 767px; border-radius: 18px; transform: scale(.7692); transform-origin: 0 0; background: #111; }
  #cap { position: absolute; left: 40px; right: 40px; bottom: 16px; padding: 12px 22px; background: rgba(5,14,9,.92); border: 1px solid #c9a24b; border-radius: 10px; color: #f1e8d3; font-size: 24px; line-height: 1.28; text-align: center; opacity: 0; transition: opacity .25s; }
  #cap.on { opacity: 1; }
  #title { position: absolute; left: 34px; top: 26px; padding: 8px 22px; background: rgba(5,14,9,.9); border-left: 6px solid #e7c873; color: #e7c873; font-size: 38px; font-weight: 700; opacity: 0; transition: opacity .3s; }
  #title.on { opacity: 1; }
  #cards { position: absolute; left: 120px; right: 120px; top: 170px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; opacity: 0; transition: opacity .4s; }
  #cards.on { opacity: 1; }
  #cards div { padding: 22px 10px; background: rgba(5,14,9,.95); border: 2px solid #c9a24b; border-radius: 12px; text-align: center; color: #f1e8d3; font-size: 22px; opacity: .25; transition: opacity .3s, transform .3s; }
  #cards div.on { opacity: 1; transform: scale(1.06); }
  #cards b { display: block; font-size: 56px; margin-bottom: 8px; }
  #cards i { display: block; font-style: normal; font-size: 16px; color: #e7c873; margin-top: 6px; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; transition: opacity .6s; pointer-events: none; }
</style>
<iframe id="big"></iframe>
<div id="worlds"></div>
<div id="phoneBox"><iframe id="phone"></iframe></div>
<div id="cards">
  <div><b>💨</b>Corredor<i>limpio y constante</i></div>
  <div><b>🦊</b>Pícaro<i>empuja a veces</i></div>
  <div><b>😤</b>Bravo<i>busca pelea</i></div>
  <div><b>🔥</b>Muy bravo<i>todo o nada</i></div>
</div>
<div id="title"></div>
<div id="cap"></div>
<div id="fade"></div>
<script>
const fs = require('fs');
const $ = id => document.getElementById(id);
const audio = new AudioContext();
const out = audio.createMediaStreamDestination();
// Un ruido inaudible mantiene viva la pista de audio en los silencios, para que imagen y voz no se desfasen
const hum = audio.createConstantSource(), humGain = audio.createGain(); humGain.gain.value = 0.0008; hum.connect(humGain).connect(out); hum.start();
const buffers = {};
let recorder, chunks = [];

async function loadVoice(id, file) { buffers[id] = await audio.decodeAudioData(fs.readFileSync(file).buffer.slice(0)); return buffers[id].duration; }
function say(id, text) {
  $('cap').textContent = text; $('cap').classList.add('on');
  return new Promise(done => {
    const s = audio.createBufferSource(); s.buffer = buffers[id]; s.connect(out); s.onended = done; s.start();
  });
}
const hideCaption = () => $('cap').classList.remove('on');
const setFade = v => { $('fade').style.opacity = v; };
const showPhone = on => $('phoneBox').classList.toggle('on', on);
const setTitle = t => { $('title').textContent = t || ''; $('title').classList.toggle('on', !!t); };
const showCards = on => $('cards').classList.toggle('on', on);
const lightCard = i => [...$('cards').children].forEach((c, k) => c.classList.toggle('on', k <= i));
function loadBig(url) { $('big').src = url; }
function loadPhone(url) { $('phone').src = url; }
function addWorld(id, url) { const f = document.createElement('iframe'); f.className = 'mundo'; f.id = 'w_' + id; f.src = url; $('worlds').append(f); }
function showWorld(id) { document.querySelectorAll('.mundo').forEach(f => f.classList.toggle('on', f.id === 'w_' + id)); }
function hideWorlds() { document.querySelectorAll('.mundo').forEach(f => f.remove()); }

async function startRecording() {
  await audio.resume();
  const screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30, width: 1280, height: 720 }, audio: false });
  const mix = new MediaStream([...screen.getVideoTracks(), ...out.stream.getAudioTracks()]);
  recorder = new MediaRecorder(mix, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 2200000, audioBitsPerSecond: 96000 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.start(1000);
  return recorder.state;
}
function stopRecording(file) {
  return new Promise(done => {
    recorder.onstop = async () => {
      const buf = Buffer.from(await new Blob(chunks).arrayBuffer());
      fs.writeFileSync(file, buf);
      done(buf.length);
    };
    recorder.stop();
  });
}
</script>
